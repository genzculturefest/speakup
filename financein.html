<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance IN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-top: 1px solid #f1f5f9; }
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden relative">

    <!-- Login Screen -->
    <div id="authScreen" class="absolute inset-0 bg-emerald-600 z-[100] flex flex-col items-center justify-center p-6 text-white transition-opacity duration-500">
        <div class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center text-emerald-600 shadow-2xl mb-6">
            <i class="fa-solid fa-wallet text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2">Finance IN</h1>
        <p class="text-emerald-100 text-center mb-10 max-w-sm">Pencatatan keuangan super cepat dan instan tanpa lag.</p>
        <button id="googleLoginBtn" class="bg-white text-gray-800 font-semibold px-6 py-3 rounded-full shadow-lg hover:scale-105 transition-all flex items-center gap-3">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Lanjutkan dengan Google
        </button>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm px-4 py-4 md:px-6 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-wallet text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-900 leading-tight" id="appNameDisplay">Finance IN</h1>
                <p class="text-[11px] text-emerald-600 font-medium tracking-wider">REALTIME TRACKER</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-right hidden md:block">
                <p class="text-sm font-semibold text-gray-800" id="userDisplayName">Pengguna</p>
                <button id="logoutBtn" class="text-xs text-rose-500 hover:underline font-medium">Keluar</button>
            </div>
            <img id="userAvatar" src="" class="w-10 h-10 rounded-full border-2 border-emerald-100 object-cover hidden">
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar pb-32">
        <div class="max-w-6xl mx-auto space-y-6">
            <!-- Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-gradient-to-br from-emerald-600 to-emerald-500 rounded-2xl p-5 text-white shadow-lg">
                    <p class="text-emerald-50 font-medium mb-2">Total Saldo</p>
                    <h2 class="text-3xl font-bold" id="totalBalance">Rp 0</h2>
                </div>
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <p class="text-gray-500 font-medium text-sm mb-2">Pemasukan</p>
                    <h2 class="text-2xl font-bold text-emerald-600" id="totalIncome">Rp 0</h2>
                </div>
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <p class="text-gray-500 font-medium text-sm mb-2">Pengeluaran</p>
                    <h2 class="text-2xl font-bold text-rose-600" id="totalExpense">Rp 0</h2>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Chart -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 lg:col-span-1 flex flex-col items-center">
                    <h3 class="text-lg font-bold text-gray-800 mb-6 w-full">Statistik</h3>
                    <div class="relative w-full max-w-[220px] aspect-square">
                        <canvas id="cashFlowChart"></canvas>
                    </div>
                </div>

                <!-- Transaction List -->
                <div class="bg-white rounded-2xl p-0 shadow-sm border border-gray-100 lg:col-span-2 flex flex-col h-[400px]">
                    <div class="p-5 border-b border-gray-50 flex justify-between items-center">
                        <h3 class="text-lg font-bold text-gray-800">Riwayat Transaksi</h3>
                        <span class="text-xs font-semibold bg-gray-100 text-gray-500 px-2 py-1 rounded-md" id="transactionCount">0 Transaksi</span>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1" id="transactionList"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none"></div>

    <!-- MANUAL INPUT FORM (NON-AI) - INSTAN 0 DETIK -->
    <div class="absolute bottom-0 left-0 right-0 p-3 glass-effect z-20">
        <div class="max-w-4xl mx-auto">
            <form id="manualForm" class="flex gap-2 items-center bg-white rounded-xl p-2 shadow-lg border border-gray-200">
                
                <!-- Pilih Jenis -->
                <select id="inputType" class="bg-gray-100 rounded-lg px-2 py-2 text-sm font-medium outline-none cursor-pointer border-r border-white">
                    <option value="expense">Keluar</option>
                    <option value="income">Masuk</option>
                </select>

                <!-- Input Keterangan -->
                <input type="text" id="inputDesc" class="flex-1 bg-gray-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-emerald-400" placeholder="Keterangan..." required autocomplete="off">
                
                <!-- Input Nominal -->
                <input type="number" id="inputAmount" class="w-28 md:w-32 bg-gray-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-emerald-400" placeholder="Rp..." required min="1">
                
                <!-- Tombol Simpan -->
                <button type="submit" class="w-10 h-10 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 transition flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Firebase Anda (Sama seperti sebelumnya)
        let firebaseConfig = {
            apiKey: "dummy",
            authDomain: "dummy.firebaseapp.com",
            projectId: "dummy"
        };
        try { if (typeof __firebase_config !== 'undefined') { firebaseConfig = JSON.parse(__firebase_config); } } catch (e) {}

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'finance-in-app';

        let currentUser = null;
        let transactions = [];
        let myChart = null;

        // UI Elements
        const uiList = document.getElementById('transactionList');
        const manualForm = document.getElementById('manualForm');

        const formatIDR = (amount) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);

        const showToast = (message) => {
            const toast = document.createElement('div');
            toast.className = `toast-enter bg-white px-4 py-3 rounded-xl shadow-lg border-l-4 border-emerald-500 flex items-center text-sm font-medium w-full mb-2`;
            toast.innerHTML = message;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => { toast.remove(); }, 2500);
        };

        // Handle Login/Logout
        document.getElementById('googleLoginBtn').addEventListener('click', () => signInWithPopup(auth, new GoogleAuthProvider()));
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('appNameDisplay').innerText = `${user.displayName.split(' ')[0]} Finance`;
                document.getElementById('userDisplayName').innerText = user.displayName;
                document.getElementById('userAvatar').src = user.photoURL;
                document.getElementById('userAvatar').classList.remove('hidden');
                
                // Ambil Data Firestore
                onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'transactions'), (snapshot) => {
                    transactions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));
                    updateUI();
                });
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
            }
        });

        // HAPUS AI: Handle Form Manual (100% INSTAN)
        manualForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const type = document.getElementById('inputType').value;
            const desc = document.getElementById('inputDesc').value;
            const amount = Number(document.getElementById('inputAmount').value);

            // INSTAN: Langsung kosongkan form
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputAmount').value = '';
            document.getElementById('inputDesc').focus();

            // INSTAN: Simpan ke Firestore
            await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'transactions'), {
                type: type,
                amount: amount,
                description: desc,
                category: type === 'income' ? 'Pemasukan' : 'Pengeluaran',
                createdAt: serverTimestamp()
            });
            
            showToast('✅ Berhasil dicatat!');
        });

        // Update UI (Chart & List)
        const updateUI = () => {
            let inc = 0, exp = 0;
            uiList.innerHTML = '';

            transactions.forEach(t => {
                const isInc = t.type === 'income';
                if(isInc) inc += t.amount; else exp += t.amount;

                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 hover:bg-gray-50 border-b border-gray-100";
                div.innerHTML = `
                    <div>
                        <p class="font-semibold text-gray-800 capitalize">${t.description}</p>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <p class="font-bold ${isInc ? 'text-emerald-500' : 'text-gray-800'}">${isInc ? '+' : '-'}${formatIDR(t.amount)}</p>
                        <button class="text-[10px] text-rose-500 mt-1" onclick="hapus('${t.id}')">Hapus</button>
                    </div>
                `;
                uiList.appendChild(div);
            });

            document.getElementById('totalBalance').innerText = formatIDR(inc - exp);
            document.getElementById('totalIncome').innerText = formatIDR(inc);
            document.getElementById('totalExpense').innerText = formatIDR(exp);
            document.getElementById('transactionCount').innerText = `${transactions.length} Transaksi`;

            // Update Chart
            if(myChart) {
                myChart.data.datasets[0].data = [inc, exp];
                myChart.update();
            } else {
                myChart = new Chart(document.getElementById('cashFlowChart').getContext('2d'), {
                    type: 'doughnut',
                    data: { labels: ['Masuk', 'Keluar'], datasets: [{ data: [inc, exp], backgroundColor: ['#34d399', '#fb7185'] }] },
                    options: { cutout: '75%', plugins: { legend: { display: false } } }
                });
            }
        };

        window.hapus = (id) => deleteDoc(doc(db, 'artifacts', appId, 'users', currentUser.uid, 'transactions', id));
    </script>
</body>
</html>
