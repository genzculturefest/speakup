<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reframe Studio 4K</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Container Layar Penuh -->
  <div id="full-screen-app" class="screen-full">
    
    <!-- Area Portrait (9:16) -->
    <div id="portrait-view" class="preview-area">
      <canvas id="canvas916" class="preview-canvas"></canvas>
      <div class="overlay-top-left">
        <div class="ratio-label">9:16</div>
        <button id="btnFlashActive" class="icon-btn" title="Flash/Torch Aktif (Mobile)">
          <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l3-8H7zm2 2h4.51l-2.5 6h4.5l-3.5 6v-5H9V4z" fill="#FFD700"/></svg>
        </button>
      </div>
      <div class="overlay-top-right">
        <div class="pro-label">★ PRO</div>
      </div>
      <div class="overlay-text bottom-center">Reframe</div>
    </div>

    <!-- Area Landscape (16:9) -->
    <div id="landscape-view" class="preview-area">
      <canvas id="canvas169" class="preview-canvas"></canvas>
      <div class="overlay-left-center">
        <div class="ratio-label-side">16:9</div>
      </div>
      <div class="overlay-text bottom-center">Reframe</div>
    </div>

    <!-- Baris Kontrol Bawah (Identik dengan Foto Ref) -->
    <div id="control-bar" class="controls-overlay">
      <div class="control-grid">
        <div class="group-left">
          <button id="btnSettings" class="icon-btn-big" title="Pengaturan">
            <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4zm-8.83 5.37l1.09-1.92.83.1c.36.04.7.13 1.04.26a6 6 0 002.3 2.1c.1.03.2.06.31.08l.19.1v1.6l1.6-.1 1.6-.1v-1.6l.2-.1c.36-.04.71-.13 1.04-.26a6 6 0 002.3-2.1c.1-.03.2-.06.3-.08l.1-.19.82-.1 1.1 1.93-.83 1.04a7 7 0 01-1.67 3.3l-.22.1-.22.1-.21.17v.3l-1.6 2.8 1.6 2.8v-1.6l.2-.1c.36-.04.71-.13 1.04-.26a6 6 0 002.3-2.1c.1-.03.2-.06.3-.08l.1-.19.82-.1 1.1 1.93-.83 1.04a7 7 0 01-1.67 3.3l-.22.1-.22.1-.21.17v.3l-1.6 2.8v1.6H12v-1.6L10.4 20l-1.6.1v-1.6l-.19.1c-.36.04-.71.13-1.04.26A6 6 0 005.27 16.6l-.1.19-.82.1-1.1-1.93.83-1.04a7 7 0 011.67-3.3l.22-.1.22-.1.21-.17v-.3l.1-.3v-.3z" fill="#ccc"/></svg>
          </button>
        </div>
        
        <div class="group-center">
          <button id="btnZoomToggle" class="zoom-btn" title="Zoom Tele (1x, 2x, 4x)">
            <span id="zoomLabel">1x</span>
          </button>
          <button id="btnRecord" class="rec-btn" title="Mulai Rekam Video 4K Ganda">
            <div id="rec-status" class="status-icon"></div>
          </button>
        </div>
        
        <div class="group-right">
          <button id="btnSwitchCam" class="icon-btn-big" title="Balik Kamera">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 110 20A10 10 0 0112 2zm0 2a8 8 0 100 16 8 8 0 000-16zm.73 13.7l1.4 1.4-2.8 2.8-2.8-2.8 1.4-1.4 1.4 1.4 1.4-1.4zM16 11l2 2-2 2v-2h-4v-2h4v-2l-2 2zm-8-2h4v2H8v2h4v2l2-2-2-2v2l2-2zM9.27 6.3L7.87 4.9 10.67 2.1l2.8 2.8-1.4 1.4-1.4-1.4-1.4 1.4z" fill="#ccc"/></svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Hidden Elements untuk Pemrosesan -->
    <video id="rawVideo" autoplay playsinline muted style="display:none;"></video>
  </div>

  <script src="app.js"></script>
</body>
</html>
