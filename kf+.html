<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monopoly Banker - Spidey Pixel Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Canvas Confetti Effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Pixel Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --pixel-bg: #091728;
      --pixel-frame-blue: #2389da;
      --pixel-frame-dark: #0f4c81;
      --pixel-yellow: #ffc700;
      --pixel-red: #e63946;
      --pixel-green: #2a9d8f;
    }

    html, body {
      height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'VT323', monospace;
      background-color: #050b14;
      background-image: 
        radial-gradient(#1e3a8a 1px, transparent 1px),
        radial-gradient(#0284c7 1px, #050b14 1px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      image-rendering: pixelated;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
    }

    /* Pixel Box Outline */
    .pixel-box {
      background-color: #0b1a2e;
      border: 3px solid #000000;
      box-shadow: 
        inset -3px -3px 0px 0px #06101d,
        inset 3px 3px 0px 0px #1e40af,
        0px 4px 0px 0px #000000;
    }

    .pixel-box-cyan {
      background-color: #1a4f7c;
      border: 3px solid #000000;
      box-shadow: 
        inset -3px -3px 0px 0px #0e2f4c,
        inset 3px 3px 0px 0px #38b6ff,
        0px 4px 0px 0px #000000;
    }

    /* Pixel Buttons */
    .pixel-btn {
      border: 2px solid #000000;
      box-shadow: 0px 3px 0px 0px #000000;
      transition: all 0.05s ease;
      text-transform: uppercase;
    }

    .pixel-btn:active {
      transform: translateY(3px);
      box-shadow: 0px 0px 0px 0px #000000;
    }

    .pixel-btn-yellow {
      background-color: #ffc700;
      color: #000000;
    }
    .pixel-btn-yellow:hover { background-color: #e6b200; }

    .pixel-btn-red {
      background-color: #e63946;
      color: #ffffff;
    }

    .pixel-btn-blue {
      background-color: #0077b6;
      color: #ffffff;
    }

    .pixel-btn-dark {
      background-color: #1e293b;
      color: #94a3b8;
    }

    /* Radar / Scanner Pixel Grid Overlay */
    .radar-overlay {
      background: 
        linear-gradient(rgba(0, 255, 204, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.1) 1px, transparent 1px);
      background-size: 12px 12px;
      pointer-events: none;
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border: 2px solid #000000 !important;
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #38b6ff; border: 1px solid #000; }

    @keyframes slideDown {
      from { transform: translate(-50%, -100%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .animate-toast {
      animation: slideDown 0.2s steps(4, end) forwards;
    }

    @keyframes pixelPop {
      0% { transform: scale(0.7); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pixel-pop {
      animation: pixelPop 0.25s steps(6, end) forwards;
    }

    /* Scanlines effect */
    .scanlines {
      position: relative;
    }
    .scanlines::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 40;
      pointer-events: none;
      opacity: 0.6;
    }
  </style>
</head>
<body class="flex flex-col text-slate-100 relative scanlines justify-center items-center">

    let state = {
      isStarted: false,
      players: {},

    };

    let html5QrCode = null;
    let currentFacingMode = "environment";
    let lastScannedCode = null;
    let scanCooldownTimer = null;
    let ndefReader = null;

    function playAudio(type = 'beep') {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'beep') {
          osc.type = 'square'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'cash') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.25);
          osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'error') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
          osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
      } catch (e) { console.log(e); }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const bgColors = {
        info: 'bg-slate-900 border-cyan-400 text-cyan-300',
        success: 'bg-black border-yellow-400 text-yellow-300',
        warning: 'bg-black border-amber-500 text-amber-400',
        error: 'bg-red-950 border-red-500 text-white'
      };

      toast.className = `animate-toast border-2 ${bgColors[type]} p-2 shadow-lg text-xs font-extrabold flex items-center gap-2 pointer-events-auto`;
      toast.innerHTML = `<i class="fa-solid fa-gamepad text-sm"></i> <span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s linear';
        setTimeout(() => toast.remove(), 200);
      }, 2500);
    }

    // PIXEL POPUP MODAL CONTROL
    function showPixelModal({ badge, icon, title, subtitle, amount, amountLabel }) {
      document.getElementById('modal-badge').innerText = badge || 'TRANSAKSI';
      document.getElementById('modal-icon').innerHTML = icon || '🕷️';
      document.getElementById('modal-title').innerText = title || '';
      document.getElementById('modal-subtitle').innerHTML = subtitle || '';
      document.getElementById('modal-amount').innerText = typeof amount === 'number' ? `$${amount.toLocaleString()}` : amount;
      document.getElementById('modal-amount-label').innerText = amountLabel || 'NOMINAL';

      document.getElementById('pixel-modal-backdrop').classList.remove('hidden');
      playAudio('cash');
      triggerConfetti();
    }

    function closeModal() {
      document.getElementById('pixel-modal-backdrop').classList.add('hidden');
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') confetti({ particleCount: 40, spread: 50, origin: { y: 0.8 }, colors: ['#ffc700', '#e63946', '#2a9d8f'] });
    }

    function init() {
      renderPlayers();
      renderLogs();
    }

    function startSensors() {
      startCamera();
      initNFCScanner();
    }

    function startCamera() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => initCameraScanner()).catch(() => initCameraScanner());
      } else {
        initCameraScanner();
      }
    }

    function initCameraScanner() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 20, qrbox: null, videoConstraints: { facingMode: currentFacingMode } };

      html5QrCode.start({ facingMode: currentFacingMode }, config, handleScanResult)
      .then(() => {
        document.getElementById('btn-start-camera').classList.add('hidden');
        document.getElementById('btn-switch-camera').classList.remove('hidden');
      }).catch(err => showToast("Gagal akses kamera.", "error"));
    }

    async function initNFCScanner() {
      const badge = document.getElementById('nfc-status-badge');

      if ('NDEFReader' in window) {
        try {
          ndefReader = new NDEFReader();
          await ndefReader.scan();

          badge.className = "font-pixel text-[6px] bg-black text-cyan-300 border border-cyan-400 px-1 py-0.5";
          badge.innerHTML = `NFC:READY`;

          // MENDENGARKAN EVENT READING TAP NFC
          ndefReader.addEventListener("reading", ({ serialNumber }) => {
            // LANGSUNG BACA SERIAL NUMBER / UID KARTU FISIK (MENGABAIKAN ISI TEKS)
            if (serialNumber) {
              const formattedSerial = serialNumber.toUpperCase();
              // Cek apakah UID ini di-mapping ke ID/Nama tertentu di NFC_UID_MAP
              const cardId = NFC_UID_MAP[formattedSerial] || formattedSerial;
              handleScanResult(cardId);
            } else {
              showToast("UID Kartu NFC tidak terdeteksi!", "warning");
            }
          });

        } catch (error) {
          console.error("NFC Error:", error);
          badge.className = "font-pixel text-[6px] bg-red-950 text-red-400 border border-red-600 px-1 py-0.5";
          badge.innerHTML = `NFC:OFF`;
        }
      } else {
        badge.className = "font-pixel text-[6px] bg-slate-900 text-slate-500 border border-slate-700 px-1 py-0.5";
        badge.innerHTML = `NFC:NO`;
      }
    }

    async function switchCamera() {
      if (!html5QrCode) return;
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      try { await html5QrCode.stop(); initCameraScanner(); } catch (err) {}
    }

    function handleScanResult(scannedData) {
      let data = scannedData.trim().toUpperCase().replace(/\.(PNG|JPG|JPEG)$/i, '');
      if (data === lastScannedCode) return;

      lastScannedCode = data;
      clearTimeout(scanCooldownTimer);
      scanCooldownTimer = setTimeout(() => { lastScannedCode = null; }, 2500);

      playAudio('beep');

      // REGISTRASI
      if (!state.isStarted) {
        if (MASTER_PLAYERS[data]) {
          if (state.players[data]) {
            playAudio('error');
            showToast(`${MASTER_PLAYERS[data].name} sudah terdaftar!`, "warning");
            return;
          }
          state.players[data] = { ...MASTER_PLAYERS[data], balance: INITIAL_BANK_MONEY };
          addLog(`👾 <b>${MASTER_PLAYERS[data].name}</b> JOIN ($${INITIAL_BANK_MONEY.toLocaleString()})`);
          
          showPixelModal({
            badge: "HERO REGISTERED",
            icon: "🕷️",
            title: MASTER_PLAYERS[data].name,
            subtitle: "Berhasil Bergabung ke Arena Game!",
            amount: INITIAL_BANK_MONEY,
            amountLabel: "SALDO AWAL"
          });

          renderPlayers();
          updateLobbyUI();
        } else {
          // Jika ID Kartu UID belum terdaftar di MASTER_PLAYERS, daftarkan secara otomatis sebagai Hero baru
          state.players[data] = { 
            name: `HERO [${data.slice(-5)}]`, 
            badge: 'bg-cyan-400', 
            border: 'border-cyan-400', 
            balance: INITIAL_BANK_MONEY 
          };
          
          addLog(`👾 <b>HERO [${data.slice(-5)}]</b> JOIN ($${INITIAL_BANK_MONEY.toLocaleString()})`);
          
          showPixelModal({
            badge: "HERO REGISTERED",
            icon: "💳",
            title: `CARD UID: ${data}`,
            subtitle: "Kartu NFC Berhasil Terdaftar!",
            amount: INITIAL_BANK_MONEY,
            amountLabel: "SALDO AWAL"
          });

          renderPlayers();
          updateLobbyUI();
        }
        return;
      }

      // GAMEPLAY - SCAN/TAP PEMAIN
      if (state.players[data]) {
        state.selectedPlayer = data;

        if (state.mode === 'GO') {
          state.players[data].balance += 20000;
          addLog(`<b>${state.players[data].name}</b> lewat START (+ $20.000)`);
          
          showPixelModal({
            badge: "BONUS START",
            icon: "🏁",
            title: "LEWAT START!",
            subtitle: `Hero <b>${state.players[data].name}</b> mendapatkan gaji putaran!`,
            amount: 20000,
            amountLabel: "DAPAT GAJI"
          });

          state.selectedPlayer = null;
          renderPlayers();
        } else if (state.mode === 'BANK') {
          const action = document.getElementById('bank-action-type').value;
          const amount = parseInt(document.getElementById('bank-amount').value) || 0;

          if (amount <= 0) {
            playAudio('error');
            showToast("Masukkan nominal!", "warning");
            return;
          }

          if (action === 'RECEIVE') {
            state.players[data].balance += amount;
            addLog(`🎁 <b>${state.players[data].name}</b> +<b>$${amount.toLocaleString()}</b>`);
            
            showPixelModal({
              badge: "DAPAT UANG",
              icon: "🎁",
              title: "DANA BANK",
              subtitle: `Hero <b>${state.players[data].name}</b> menerima dana dari Bank!`,
              amount: amount,
              amountLabel: "TOTAL DITERIMA"
            });
          } else if (action === 'PAY') {
            if (state.players[data].balance < amount) {
              playAudio('error');
              showToast(`Saldo ${state.players[data].name} kurang!`, "error");
              return;
            }
            state.players[data].balance -= amount;
            addLog(`💸 <b>${state.players[data].name}</b> -<b>$${amount.toLocaleString()}</b>`);
            
            showPixelModal({
              badge: "BAYAR DENDA",
              icon: "💸",
              title: "POTONGAN BANK",
              subtitle: `Hero <b>${state.players[data].name}</b> membayar kewajiban ke Bank!`,
              amount: amount,
              amountLabel: "TOTAL DIBAYAR"
            });
          }

          state.selectedPlayer = null;
          renderPlayers();
        }

        updateStatusUI();
        return;
      }

      // SCAN PROPERTI (QR CODE)
      if (PROPERTIES[data]) {
        const prop = PROPERTIES[data];
        const propState = state.ownership[data];

        if (state.mode === 'BUY') {
          if (!state.selectedPlayer) { playAudio('error'); showToast("Tap Kartu Player Dulu!", "warning"); return; }

          if (!propState) {
            if (state.players[state.selectedPlayer].balance < prop.price) { 
              playAudio('error'); showToast(`Saldo Kurang! Harga: $${prop.price.toLocaleString()}`, "error"); return; 
            }

            state.players[state.selectedPlayer].balance -= prop.price;
            state.ownership[data] = { owner: state.selectedPlayer, level: 0, isMortgaged: false };
            addLog(`<b>${state.players[state.selectedPlayer].name}</b> Beli <b>${prop.name}</b> (-$${prop.price.toLocaleString()})`);
            
            showPixelModal({
              badge: "PEMBELIAN ASET",
              icon: prop.flag,
              title: prop.name,
              subtitle: `Pemilik Baru: <b>${state.players[state.selectedPlayer].name}</b>`,
              amount: prop.price,
              amountLabel: "HARGA BELI"
            });

          } else if (propState.owner === state.selectedPlayer) {
            if (propState.isMortgaged) {
              playAudio('error'); showToast("Aset Digadaikan! Tebus dulu.", "warning"); return;
            }
            if (prop.type !== 'COUNTRY') {
              playAudio('error'); showToast(`Aset tidak bisa diupgrade!`, "warning"); return;
            }
            if (propState.level >= 5) { 
              playAudio('error'); showToast(`Sudah level Max (Hotel)!`, "warning"); return; 
            }
            
            const upgradeCost = propState.level === 4 ? prop.hotelPrice : prop.housePrice;
            if (state.players[state.selectedPlayer].balance < upgradeCost) { 
              playAudio('error'); showToast(`Saldo kurang! Biaya: $${upgradeCost.toLocaleString()}`, "error"); return; 
            }

            state.players[state.selectedPlayer].balance -= upgradeCost;
            propState.level += 1;
            const label = propState.level === 5 ? "Hotel 🏨" : `Rumah ${propState.level} 🏠`;
            addLog(`<b>${state.players[state.selectedPlayer].name}</b> Upgrade ${label} di <b>${prop.name}</b>`);
            
            showPixelModal({
              badge: "UPGRADE ASET",
              icon: propState.level === 5 ? "🏨" : "🏠",
              title: `${prop.flag} ${prop.name}`,
              subtitle: `<b>${state.players[state.selectedPlayer].name}</b> berhasil bangun ${label}!`,
              amount: upgradeCost,
              amountLabel: "BIAYA BUILD"
            });

          } else {
            playAudio('error'); showToast(`Aset Milik ${state.players[propState.owner].name}!`, "error");
          }

          state.selectedPlayer = null;
          renderPlayers();
          updateStatusUI();

        } else if (state.mode === 'RENT') {
          if (!propState) { playAudio('error'); showToast(`Aset Belum Milik Siapapun!`, "warning"); return; }
          if (!state.selectedPlayer) { playAudio('error'); showToast("Tap Kartu Player Singgah!", "warning"); return; }
          if (propState.owner === state.selectedPlayer) { showToast("Pemain di aset sendiri!", "info"); state.selectedPlayer = null; updateStatusUI(); return; }
          
          if (propState.isMortgaged) {
            showToast(`Aset DIGADAIKAN! Bebas sewa.`, "info");
            state.selectedPlayer = null;
            updateStatusUI();
            return;
          }

          const visitorId = state.selectedPlayer;
          const ownerId = propState.owner;
          let calculatedRent = 0;

          if (prop.type === 'COUNTRY') {
            calculatedRent = prop.rent[propState.level];
          } else if (prop.type === 'UTILITY') {
            const diceInput = prompt(`Kalkulasi Sewa (${prop.name}):\nMasukkan total kocokan 2 Dadu:`, "7");
            const diceVal = parseInt(diceInput) || 0;
            const utilityCount = Object.keys(state.ownership).filter(pKey => PROPERTIES[pKey].type === 'UTILITY' && state.ownership[pKey].owner === ownerId).length;
            calculatedRent = diceVal * (utilityCount >= 2 ? 10 : 4);
          } else if (prop.type === 'STATION') {
            const stationCount = Object.keys(state.ownership).filter(pKey => PROPERTIES[pKey].type === 'STATION' && state.ownership[pKey].owner === ownerId).length;
            const index = Math.min(stationCount - 1, prop.rentTable.length - 1);
            calculatedRent = prop.rentTable[index >= 0 ? index : 0];
          }

          if (state.players[visitorId].balance < calculatedRent) {
            playAudio('error'); showToast(`Saldo ${state.players[visitorId].name} kurang!`, "error"); return;
          }

          state.players[visitorId].balance -= calculatedRent;
          state.players[ownerId].balance += calculatedRent;

          addLog(`<b>${state.players[visitorId].name}</b> Bayar Sewa ke <b>${state.players[ownerId].name}</b> ($${calculatedRent.toLocaleString()})`);
          
          showPixelModal({
            badge: "BAYAR SEWA ASET",
            icon: prop.flag,
            title: prop.name,
            subtitle: `<b>${state.players[visitorId].name}</b> ➡️ <b>${state.players[ownerId].name}</b>`,
            amount: calculatedRent,
            amountLabel: "BIAYA SEWA"
          });

          state.selectedPlayer = null;
          renderPlayers();
          updateStatusUI();

        } else if (state.mode === 'MORTGAGE') {
          if (!propState) { playAudio('error'); showToast(`Aset Belum Milik Siapapun!`, "warning"); return; }
          if (!state.selectedPlayer) { playAudio('error'); showToast("Tap Kartu Player Pemilik!", "warning"); return; }
          if (propState.owner !== state.selectedPlayer) { playAudio('error'); showToast(`Aset Milik ${state.players[propState.owner].name}!`, "error"); return; }

          if (!propState.isMortgaged) {
            const mortgageValue = prop.mortgage;
            state.players[state.selectedPlayer].balance += mortgageValue;
            propState.isMortgaged = true;
            addLog(`🏷️ <b>${state.players[state.selectedPlayer].name}</b> Gadai <b>${prop.name}</b> (+ $${mortgageValue.toLocaleString()})`);
            
            showPixelModal({
              badge: "GADAI ASET",
              icon: "🏷️",
              title: `${prop.flag} ${prop.name}`,
              subtitle: `<b>${state.players[state.selectedPlayer].name}</b> menggadaikan sertifikat aset`,
              amount: mortgageValue,
              amountLabel: "PINJAMAN DITERIMA"
            });

          } else {
            const unmortgageCost = Math.round(prop.mortgage * 1.1);
            if (state.players[state.selectedPlayer].balance < unmortgageCost) {
              playAudio('error'); showToast(`Saldo kurang untuk tebus! Biaya: $${unmortgageCost.toLocaleString()}`, "error"); return;
            }

            state.players[state.selectedPlayer].balance -= unmortgageCost;
            propState.isMortgaged = false;
            addLog(`🔓 <b>${state.players[state.selectedPlayer].name}</b> Tebus <b>${prop.name}</b> (- $${unmortgageCost.toLocaleString()})`);
            
            showPixelModal({
              badge: "TEBUS ASET",
              icon: "🔓",
              title: `${prop.flag} ${prop.name}`,
              subtitle: `<b>${state.players[state.selectedPlayer].name}</b> menebus kembali aset`,
              amount: unmortgageCost,
              amountLabel: "BIAYA TEBUS (+10%)"
            });
          }

          state.selectedPlayer = null;
          renderPlayers();
          updateStatusUI();
        }
      } else {
        playAudio('error'); showToast(`KODE UNKNOWN: "${scannedData}"`, "error");
      }
    }

    function declareBankruptcy() {
      if (!state.selectedPlayer) {
        showToast("Tap Kartu Player yang Bangkrut!", "warning");
        return;
      }

      const player = state.players[state.selectedPlayer];
      if (confirm(`Yakin ${player.name} BANGKRUT? Semua aset dilepas.`)) {
        Object.keys(state.ownership).forEach(propKey => {
          if (state.ownership[propKey].owner === state.selectedPlayer) {
            delete state.ownership[propKey];
          }
        });

        addLog(`💥 <b>${player.name}</b> BANGKRUT!`);
        playAudio('error');
        
        showPixelModal({
          badge: "PLAYER ELIMINATED",
          icon: "💀",
          title: player.name,
          subtitle: "Telah dinyatakan **BANGKRUT** dan keluar dari permainan!",
          amount: "OUT",
          amountLabel: "STATUS GAME"
        });

        delete state.players[state.selectedPlayer];
        state.selectedPlayer = null;
        renderPlayers();
        updateStatusUI();
        updateLobbyUI();
      }
    }

    function updateLobbyUI() {
      const count = Object.keys(state.players).length;
      document.getElementById('player-count-badge').innerText = `${count} HERO`;

      const startBtn = document.getElementById('btn-start-game');
      if (count >= 2) {
        startBtn.disabled = false;
        startBtn.className = "w-full pixel-btn pixel-btn-yellow font-pixel text-[8px] py-2 cursor-pointer";
      } else {
        startBtn.disabled = true;
        startBtn.className = "w-full bg-slate-800 text-slate-500 font-pixel text-[8px] py-1.5 border-2 border-black opacity-50 cursor-not-allowed";
      }
    }

    function finalizeRegistration() {
      if (Object.keys(state.players).length < 2) return;
      state.isStarted = true;
      
      const badge = document.getElementById('game-status-badge');
      if (badge) {
        badge.className = "font-pixel text-[7px] bg-black text-cyan-300 border border-cyan-400 px-1.5 py-1";
        badge.innerText = "RUNNING";
      }

      document.getElementById('panel-registration').classList.add('hidden');
      document.getElementById('panel-gameplay').classList.remove('hidden');

      addLog("🎲 <b>GAME STARTED!</b>");
      
      showPixelModal({
        badge: "GAME READY",
        icon: "🎲",
        title: "GAME DIMULAI!",
        subtitle: "Selamat bertanding para Hero Spider-Man!",
        amount: "READY",
        amountLabel: "STATUS ARENA"
      });

      updateStatusUI();
    }

    function renderPlayers() {
      const container = document.getElementById('player-list');
      container.innerHTML = '';
      const playerKeys = Object.keys(state.players);

      if (playerKeys.length === 0) {
        container.innerHTML = `
          <div class="col-span-2 text-center py-2 border-2 border-dashed border-slate-700 bg-black/40">
            <p class="text-xs text-slate-400 font-bold">BELUM ADA HERO</p>
          </div>
        `;
        return;
      }

      let maxBalance = -1;
      playerKeys.forEach(pId => {
        if (state.players[pId].balance > maxBalance) maxBalance = state.players[pId].balance;
      });
      
      playerKeys.forEach(pId => {
        const p = state.players[pId];
        const properties = Object.keys(state.ownership).filter(prop => state.ownership[prop].owner === pId);
        const isLeader = state.isStarted && p.balance === maxBalance && maxBalance > 0;
        
        container.innerHTML += `
          <div class="relative bg-black/80 border-2 ${isLeader ? 'border-yellow-400' : (p.border || 'border-cyan-400')} p-1.5 flex flex-col justify-between">
            ${isLeader ? `<span class="absolute -top-2 -right-1 text-xs">👑</span>` : ''}
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-1">
                <span class="w-2 h-2 ${p.badge || 'bg-cyan-400'}"></span>
                <span class="font-extrabold text-xs text-white">${p.name}</span>
              </div>
              <span class="text-[10px] text-cyan-300 font-bold">${properties.length} ASET</span>
            </div>
            <p class="text-sm font-black text-yellow-400 mt-0.5">$${p.balance.toLocaleString()}</p>
          </div>
        `;
      });
    }

    function setTransactionMode(mode) {
      state.mode = mode;
      state.selectedPlayer = null;
      
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.className = 'mode-btn pixel-btn pixel-btn-dark font-pixel text-[6px] py-1 flex flex-col items-center gap-0.5';
      });

      const bankContainer = document.getElementById('bank-input-container');
      if (mode === 'BANK') {
        bankContainer.classList.remove('hidden');
      } else {
        bankContainer.classList.add('hidden');
      }

      const activeBtn = document.getElementById(`btn-${mode}`);
      if (mode === 'BUY') activeBtn.className = 'mode-btn pixel-btn pixel-btn-red font-pixel text-[6px] py-1 flex flex-col items-center gap-0.5';
      if (mode === 'RENT') activeBtn.className = 'mode-btn pixel-btn pixel-btn-blue font-pixel text-[6px] py-1 flex flex-col items-center gap-0.5';
      if (mode === 'MORTGAGE') activeBtn.className = 'mode-btn pixel-btn pixel-btn-yellow font-pixel text-[6px] py-1 flex flex-col items-center gap-0.5';
      if (mode === 'GO') activeBtn.className = 'mode-btn pixel-btn pixel-btn-blue font-pixel text-[6px] py-1 flex flex-col items-center gap-0.5';
      if (mode === 'BANK') activeBtn.className = 'mode-btn pixel-btn pixel-btn-red font-pixel text-[6px] py-1 flex flex-col items-center gap-0.5';

      updateStatusUI();
    }

    function updateStatusUI() {
      const statusText = document.getElementById('status-text');

      if (state.mode === 'BANK') {
        statusText.innerText = `[Mode Bank] Set nominal, lalu Tap/Scan Hero.`;
      } else if (state.mode === 'MORTGAGE') {
        statusText.innerText = state.selectedPlayer 
          ? `Hero ${state.selectedPlayer} dipilih. Scan Aset.` 
          : `[Mode Gadai] Tap Kartu Hero pemilik.`;
      } else if (!state.selectedPlayer) {
        statusText.innerText = `[Mode ${state.mode}] Tap Kartu Hero dulu.`;
      } else {
        statusText.innerText = `Hero ${state.selectedPlayer} dipilih. Scan QR Aset.`;
      }
    }

    function addLog(message) {
      const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      state.logs.unshift({ message, time });
      renderLogs();
    }

    function renderLogs() {
      const container = document.getElementById('log-list');
      if (state.logs.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-center py-1 text-xs">Belum ada transaksi.</p>`;
        return;
      }
      
      container.innerHTML = state.logs.map(log => `
        <div class="flex justify-between items-center p-1 bg-black/80 border border-slate-800 text-xs">
          <span class="text-slate-200">${log.message}</span>
          <span class="text-[10px] text-cyan-400 font-mono ml-2 shrink-0">${log.time}</span>
        </div>
      `).join('');
    }

    function resetGame() {
      if (confirm("Reset game dari awal?")) {
        location.reload();
      }
    }

    init();
  </script>
