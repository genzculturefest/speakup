<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dual Camera Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app" class="app-container">
    
    <!-- Element Video Kamera (Tersembunyi) -->
    <video id="rawVideo" autoplay playsinline muted style="display:none;"></video>

    <!-- Area Dual Viewfinder -->
    <div class="viewfinders-wrapper">
      
      <!-- Frame 9:16 (Portrait) -->
      <div class="frame-box frame-916">
        <div class="badge badge-ratio top-left">9:16</div>
        <canvas id="canvas916"></canvas>
      </div>

      <!-- Frame 16:9 (Landscape) -->
      <div class="frame-box frame-169">
        <div class="badge badge-ratio bottom-left">16:9</div>
        <canvas id="canvas169"></canvas>
      </div>

    </div>

    <!-- Toolbar Bawah (5 Tombol Kontrol Utama) -->
    <div class="bottom-toolbar">
      
      <!-- 1. Flash / Senter -->
      <button id="btnFlash" class="tool-btn icon-btn" title="Flash">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 2v11h3v9l7-12h-4l3-8H7zm2 2h4.51l-2.5 6h4.5l-3.5 6v-5H9V4z" fill="#FFF"/></svg>
      </button>

      <!-- 2. Zoom Tele -->
      <button id="btnZoom" class="tool-btn pill-btn" title="Zoom Tele">1x</button>

      <!-- 3. Tombol Rekam Video -->
      <button id="btnRecord" class="shutter-btn" title="Rekam">
        <div class="shutter-inner"></div>
      </button>

      <!-- 4. Pengaturan (Setting) -->
      <button id="btnSettings" class="tool-btn icon-btn" title="Pengaturan">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="#FFF"/></svg>
      </button>

      <!-- 5. Balik Kamera -->
      <button id="btnFlip" class="tool-btn icon-btn" title="Balik Kamera">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="#FFF"/></svg>
      </button>

    </div>

  </div>

  <!-- Modal Settings -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <button id="btnCloseSettings" class="btn-back">&larr;</button>
        <h3>Settings</h3>
        <div style="width:24px;"></div>
      </div>
      <div class="modal-body">
        <div class="card-group">
          <div class="row-item">
            <span>Default Camera</span>
            <span id="labelDefaultCam" class="text-muted">Back</span>
          </div>
        </div>

        <div class="section-title">Export</div>
        <div class="card-group">
          <div class="col-item">
            <span>Quality</span>
            <div class="segmented-control" id="qualityControl">
              <button data-value="720p">720p</button>
              <button data-value="1080p">1080p</button>
              <button data-value="4k" class="active">4K</button>
            </div>
          </div>
          <div class="col-item">
            <span>Frame Rate</span>
            <div class="segmented-control" id="fpsControl">
              <button data-value="24">24 FPS</button>
              <button data-value="30">30 FPS</button>
              <button data-value="60" class="active">60 FPS</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
